version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci(deps)'
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: terraform
    directories:
      - /
      - /examples/*
    schedule:
      interval: weekly
    commit-message:
      prefix: 'chore(deps)'
    groups:
      terraform:
        patterns:
          - '*'
